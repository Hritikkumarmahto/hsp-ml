name: Deploy House Price Backend to EC2

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # 1. Checkout repository
      # -----------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # -----------------------------
      # 2. Login to Docker Hub
      # -----------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # -----------------------------
      # 3. Build Docker image
      # -----------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/house-price-backend:latest .


      # -----------------------------
      # 4. Push image to Docker Hub
      # -----------------------------
      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/house-price-backend:latest


      # -----------------------------
      # 5. Deploy to EC2
      # -----------------------------
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true

          script: |

            IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/house-price-backend:latest

            echo "Pulling latest image..."

            docker pull $IMAGE

            echo "Stopping old container..."

            docker stop house-price-backend || true

            echo "Removing old container..."

            docker rm house-price-backend || true

            echo "Starting new container..."

            docker run -d \
              --name house-price-backend \
              --restart unless-stopped \
              --network host \
              -e MLFLOW_TRACKING=http://127.0.0.1:5000 \
              $IMAGE

            echo "Cleaning unused images..."

            docker image prune -f


      # -----------------------------
      # 6. Health check
      # -----------------------------
      - name: Health check
        run: |

          curl \
            --fail \
            --retry 15 \
            --retry-delay 6 \
            --retry-connrefused \
            http://${{ secrets.EC2_HOST }}:8000/health


      # -----------------------------
      # 7. Show logs if deployment fails
      # -----------------------------
      - name: Show container logs on failure
        if: failure()

        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            docker logs --tail 100 house-price-backend