name: House Price Model - Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/house-price-model:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/house-price-model:${{ steps.meta.outputs.tag }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/house-price-model:${{ needs.build.outputs.tag }}
            docker pull $IMAGE
            docker stop house-price-model || true
            docker rm house-price-model || true
            docker run -d --name house-price-model \
              --restart unless-stopped \
              --network host \
              -e MLFLOW_TRACKING=http://127.0.0.1:5000 \
              $IMAGE
            docker image prune -f

      - name: Health check
        run: |
          curl --fail --retry 10 --retry-delay 5 --retry-connrefused \
            http://${{ secrets.EC2_HOST }}:8000/health